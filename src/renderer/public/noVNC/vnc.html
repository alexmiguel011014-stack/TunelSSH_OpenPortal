<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VNC Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #vnc-container {
      width: 100%; height: 100%; overflow: hidden;
    }
    #error-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.85); z-index: 999;
      align-items: center; justify-content: center;
    }
    #error-overlay.visible { display: flex; }
    #error-box {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 32px; text-align: center; max-width: 400px;
    }
    #error-box h2 { color: #f87171; font-size: 16px; margin-bottom: 8px; }
    #error-box p { color: #94a3b8; font-size: 13px; margin-bottom: 16px; }
    #error-box button {
      background: #2563eb; color: white; border: none; padding: 8px 20px;
      border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    #error-box button:hover { background: #3b82f6; }
    #connecting-overlay {
      position: fixed; inset: 0; background: #000; z-index: 998;
      display: flex; align-items: center; justify-content: center;
    }
    #connecting-overlay.hidden { display: none; }
    #connecting-overlay .spinner {
      width: 32px; height: 32px; border: 3px solid #2563eb;
      border-top-color: transparent; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #connecting-overlay p { color: #64748b; font-size: 13px; margin-top: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="connecting-overlay">
    <div style="text-align:center">
      <div class="spinner"></div>
      <p id="connecting-text">Connecting...</p>
    </div>
  </div>

  <div id="error-overlay">
    <div id="error-box">
      <h2>Connection Failed</h2>
      <p id="error-msg">Could not reach the VNC server</p>
      <button onclick="reconnect()">Retry</button>
    </div>
  </div>

  <div id="vnc-container"></div>

  <script type="module">
    import RFB from './novnc.js';
    import {
      INITIAL_VIEWER_SESSION,
      applyParentMessage,
      credentialsRequested,
      isAuthenticationFailure,
      isExpectedParentMessage,
      isServerRefusal,
      sessionEnded,
    } from './vnc-protocol.js';

    const params = new URLSearchParams(window.location.search);
    const host = params.get('host');
    const port = params.get('port') || '5900';
    const proxyWs = params.get('proxy') || 'ws://127.0.0.1:18900';
    const attemptId = params.get('attempt') || '';

    const connectingOverlay = document.getElementById('connecting-overlay');
    const connectingText = document.getElementById('connecting-text');
    const errorOverlay = document.getElementById('error-overlay');
    const errorMsg = document.getElementById('error-msg');
    const container = document.getElementById('vnc-container');

    let rfb = null;
    let fbWidth = 0;
    let fbHeight = 0;
    let session = INITIAL_VIEWER_SESSION;
    let terminalReported = false;

    function postToParent(payload) {
      parent.postMessage({ ...payload, attemptId }, '*');
    }

    function reportStatus(state, message = '') {
      postToParent({ type: 'vnc-status', state, message });
    }

    function reportTerminal(state, message) {
      if (terminalReported) return;
      terminalReported = true;
      reportStatus(state, message);
    }

    function getFbWidth() {
      return fbWidth || (rfb && rfb._fbWidth) || 0;
    }

    function getFbHeight() {
      return fbHeight || (rfb && rfb._fbHeight) || 0;
    }

    function fitScreen() {
      if (!rfb) return;
      const fbW = getFbWidth();
      const fbH = getFbHeight();
      if (fbW <= 0 || fbH <= 0) return;
      const cw = container.clientWidth;
      const ch = container.clientHeight;
      if (cw <= 0 || ch <= 0) return;

      const scale = Math.min(cw / fbW, ch / fbH, 1);
      // Reaplicar a mesma escala redimensiona o canvas e realimenta o
      // ResizeObserver dele: virava um loop a cada quadro, inundando o log.
      if (rfb._display && Math.abs(rfb._display.scale - scale) > 0.001) {
        rfb._display.scale = scale;
      }
    }

    // Os ResizeObserver ajustam no próximo quadro, fora do ciclo de layout
    // (evita o erro "ResizeObserver loop completed with undelivered notifications").
    let fitPending = false;
    function scheduleFit() {
      if (fitPending) return;
      fitPending = true;
      requestAnimationFrame(() => {
        fitPending = false;
        fitScreen();
      });
    }

    function connect() {
      if (!host) {
        errorMsg.textContent = 'No host specified';
        errorOverlay.classList.add('visible');
        return;
      }

      const wsUrl = `${proxyWs}?host=${host}&port=${port}`;
      console.log('[vnc] Connect:', { host, port, proxyWs: proxyWs.split('?')[0] });
      connectingOverlay.classList.remove('hidden');
      connectingText.textContent = `Connecting to ${host}:${port}...`;

      try {
        rfb = new RFB(container, wsUrl, {
          scaleViewport: false,
          resizeSession: false,
          showDotCursor: true,
          keyboardDelay: 20,
          qualityLevel: 4,
          compressionLevel: 3,
          credentials: undefined,
        });

        rfb.addEventListener('connect', () => {
          console.log('[vnc] Connected to', host);
          connectingOverlay.classList.add('hidden');
          errorOverlay.classList.remove('visible');
          fbWidth = rfb._fbWidth || 0;
          fbHeight = rfb._fbHeight || 0;
          fitScreen();
          postToParent({ type: 'vnc-resolution', width: fbWidth, height: fbHeight });
          reportStatus('connected', 'Sessão VNC conectada');
          const roCanvas = new ResizeObserver(scheduleFit);
          const canvas = container.querySelector('canvas');
          if (canvas) roCanvas.observe(canvas);
        });

        rfb.addEventListener('disconnect', (e) => {
          session = sessionEnded(session);
          const clean = e.detail ? e.detail.clean : 'unknown';
          if (!terminalReported && clean === false) {
            errorMsg.textContent = 'Conexão VNC perdida';
            errorOverlay.classList.add('visible');
            reportTerminal('connection-lost', 'Conexão VNC perdida');
          } else if (!terminalReported) {
            reportTerminal('disconnected', 'Sessão VNC encerrada');
          }
          connectingOverlay.classList.add('hidden');
        });

        rfb.addEventListener('credentialsrequired', () => {
          session = credentialsRequested(session);
          connectingText.textContent = 'Aguardando a senha do servidor VNC...';
          reportStatus('credentials-required', 'Senha VNC necessária');
        });

        rfb.addEventListener('error', (e) => {
          session = sessionEnded(session);
          const msg = e.detail?.message || e.detail || 'Unknown error';
          const authenticationFailed = isAuthenticationFailure(msg);
          errorMsg.textContent = authenticationFailed ? 'Senha VNC não aceita' : 'Conexão VNC perdida';
          connectingOverlay.classList.add('hidden');
          errorOverlay.classList.add('visible');
          reportTerminal(
            authenticationFailed ? 'authentication-failed' : 'connection-lost',
            authenticationFailed ? 'Senha VNC não aceita' : 'Conexão VNC perdida',
          );
        });

        rfb.addEventListener('securityfailure', (e) => {
          session = sessionEnded(session);
          const reason = e.detail?.reason || '';
          connectingOverlay.classList.add('hidden');
          errorOverlay.classList.add('visible');
          if (isServerRefusal({ context: rfb?._securityContext, reason })) {
            errorMsg.textContent = 'O TightVNC recusou a conexão antes de pedir a senha';
            reportTerminal('server-refused', reason || 'Servidor VNC recusou a conexão');
            return;
          }
          errorMsg.textContent = 'Senha VNC não aceita';
          reportTerminal('authentication-failed', errorMsg.textContent);
        });
      } catch (err) {
        errorMsg.textContent = 'Não foi possível abrir a sessão VNC';
        connectingOverlay.classList.add('hidden');
        errorOverlay.classList.add('visible');
        reportTerminal('connection-lost', 'Não foi possível abrir a sessão VNC');
      }
    }

    if (window.ResizeObserver) {
      const ro = new ResizeObserver(scheduleFit);
      ro.observe(container);
    }

    window.addEventListener('message', (e) => {
      if (!isExpectedParentMessage(e, parent, attemptId)) return;
      if (e.data?.type === 'resize-viewport') fitScreen();
      if (e.data?.type === 'set-quality' || e.data?.type === 'set-quality-level') {
        if (rfb && typeof rfb.setQualityLevel === 'function') {
          rfb.setQualityLevel(e.data.level);
        } else if (rfb && rfb._display) {
          rfb._display.qualityLevel = e.data.level;
        }
      }
      if (e.data?.type === 'set-compression' || e.data?.type === 'set-compression-level') {
        if (rfb && typeof rfb.setCompressionLevel === 'function') {
          rfb.setCompressionLevel(e.data.level);
        }
      }
      const { session: next, effect } = applyParentMessage(session, e.data);
      session = next;
      if (effect?.type === 'close') {
        reportTerminal('disconnected', effect.message);
        if (rfb) { try { rfb.disconnect(); } catch (err) {} rfb = null; }
      }
      if (effect?.type === 'send-credentials' && rfb) {
        connectingText.textContent = `Conectando a ${host}:${port}...`;
        rfb.sendCredentials({ password: effect.password });
      }
    });

    window.reconnect = () => {
      postToParent({ type: 'vnc-reconnect-request' });
    };

    postToParent({ type: 'vnc-ready' });

    connect();
  </script>
</body>
</html>
