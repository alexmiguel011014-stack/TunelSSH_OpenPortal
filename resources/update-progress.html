<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:24px}
h1{font-size:16px;font-weight:500;margin-bottom:4px;color:#f1f5f9}
#status{font-size:13px;color:#94a3b8;margin-bottom:20px}
.progress-track{width:100%;max-width:340px;background:#1e293b;border-radius:8px;height:10px;overflow:hidden;position:relative}
.progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#2563eb);width:0%;border-radius:8px;transition:width .3s ease}
#pct-text{font-size:12px;color:#64748b;margin-top:6px;font-variant-numeric:tabular-nums}
#log{width:100%;max-width:340px;margin-top:16px;font-size:11px;color:#64748b;font-family:monospace;max-height:100px;overflow-y:auto;line-height:1.6}
#log div::before{content:'> ';color:#475569}
</style>
</head>
<body>
<h1>Atualizando OpenPortal Remote</h1>
<div id="status">Verificando...</div>
<div class="progress-track"><div class="progress-fill" id="bar"></div></div>
<div id="pct-text"></div>
<div id="log"></div>
<script>
function setStatus(t){document.getElementById('status').textContent=t}
function setProgress(p){document.getElementById('bar').style.width=p+'%';document.getElementById('pct-text').textContent=p+'%'}
function addLog(m){var e=document.getElementById('log'),d=document.createElement('div');d.textContent=new Date().toLocaleTimeString()+' '+m;e.appendChild(d);e.scrollTop=e.scrollHeight}
</script>
</body>
</html>
