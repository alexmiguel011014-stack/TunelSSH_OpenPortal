name: Supabase keep-alive

# O plano gratuito do Supabase pausa o projeto depois de uma semana sem uso, e as contas do app
# (GOALS 20) ficariam fora do ar até alguém restaurá-lo no painel. Duas chamadas por semana a
# `public.ping()` (supabase/migrations/*_ping.sql) mantêm o projeto acordado.
on:
  schedule:
    - cron: '17 9 * * 1,4'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the Supabase project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY não configurados: nada a fazer."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
          echo "Projeto respondeu."
