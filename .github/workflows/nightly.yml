name: Build Dev Pre-release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Generate dev version
        run: node scripts/bump-dev-version.js

      - name: Build renderer
        run: npm run build

      - name: Generate self-signed code-signing cert
        shell: pwsh
        run: |
          $pfx = "resources/cert.pfx"
          $pwd = "openportal123"
          $cer = "resources/cert.cer"
          if (-not (Test-Path $pfx)) {
            $sec = ConvertTo-SecureString $pwd -Force -AsPlainText
            $cert = New-SelfSignedCertificate -Type Custom `
              -Subject 'CN=OpenPortal Remote, O=OpenPortal, C=BR' `
              -KeyUsage DigitalSignature `
              -FriendlyName 'OpenPortal Remote Code Signing' `
              -CertStoreLocation 'Cert:\CurrentUser\My' `
              -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3')
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $sec | Out-Null
            Export-Certificate  -Cert $cert -FilePath $cer -Type CERT      | Out-Null
            Write-Host "Certificate created"
          } else {
            Write-Host "Certificate already present"
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Stage release assets
        shell: pwsh
        run: |
          $ver  = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $dist = "dist-electron"
          Get-ChildItem $dist -Filter "OpenPortal Remote Setup *.exe*" | ForEach-Object {
            $newname = $_.Name -replace ' ', '-'
            Copy-Item $_.FullName $newname -Force
            Write-Host "Staged $($_.Name) -> $newname"
          }
          if (Test-Path "$dist\latest.yml") { Copy-Item "$dist\latest.yml" "latest.yml" -Force }
          if (Test-Path "resources/cert.cer") { Copy-Item "resources/cert.cer" "cert.cer" -Force }
          Get-ChildItem | Where-Object { $_.Name -like "OpenPortal-Remote-Setup-*.exe*" -or $_.Name -eq "latest.yml" -or $_.Name -eq "cert.cer" } | Format-Table Name, Length
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_number }}-${{ github.run_attempt }}
          name: 'Dev build #${{ github.run_number }}'
          prerelease: true
          generate_release_notes: true
          files: |
            OpenPortal-Remote-Setup-*.exe
            OpenPortal-Remote-Setup-*.exe.blockmap
            latest.yml
            cert.cer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
