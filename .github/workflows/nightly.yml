name: Build Dev Pre-release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build:
    needs: lint-test
    # A build assina e publica um instalador com GITHUB_TOKEN de escrita —
    # não roda em PR (poderia vir de fork), só em push direto/master ou
    # disparo manual. O lint-test acima cobre PRs sem tocar em secrets.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Generate dev version
        run: node scripts/bump-dev-version.js

      - name: Build renderer
        run: npm run build

      # A sidecar RDP (C#/.NET 4.8) vai no instalador por extraResources
      # (package.json). Sem este passo o app instalado não teria RDP.
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build RDP sidecar (Release)
        shell: pwsh
        run: |
          msbuild sidecar/OpenPortalRdpSidecar.csproj -restore -p:Configuration=Release -v:m -nologo
          if (-not (Test-Path sidecar/bin/Release/OpenPortalRdpSidecar.exe)) { throw 'A sidecar RDP nao foi compilada' }

      - name: Generate self-signed code-signing cert
        shell: pwsh
        run: |
          $pfx = "resources/cert.pfx"
          # Gerada em runtime: só protege o .pfx dentro deste mesmo job (o
          # cert é self-signed e nunca sai do runner), não precisa ser um
          # valor fixo/conhecido.
          $pwd = [System.Guid]::NewGuid().ToString("N")
          $cer = "resources/cert.cer"
          if (-not (Test-Path $pfx)) {
            $sec = ConvertTo-SecureString $pwd -Force -AsPlainText
            $cert = New-SelfSignedCertificate -Type Custom `
              -Subject 'CN=OpenPortal Remote, O=OpenPortal, C=BR' `
              -KeyUsage DigitalSignature `
              -FriendlyName 'OpenPortal Remote Code Signing' `
              -CertStoreLocation 'Cert:\CurrentUser\My' `
              -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3')
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $sec | Out-Null
            Export-Certificate  -Cert $cert -FilePath $cer -Type CERT      | Out-Null
            Write-Host "Certificate created"
          } else {
            Write-Host "Certificate already present"
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Stage release assets
        id: stage
        shell: pwsh
        run: |
          $ver  = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $dist = "dist-electron"
          Get-ChildItem $dist -Filter "OpenPortal Remote Setup *.exe*" | ForEach-Object {
            $newname = $_.Name -replace ' ', '-'
            Copy-Item $_.FullName $newname -Force
            Write-Host "Staged $($_.Name) -> $newname"
          }
          # O electron-builder grava latest.yml mesmo numa versão -beta (com o
          # provider github o canal não vem da versão), e o electron-updater
          # de um app beta instalado procura beta.yml: publica os dois iguais.
          if (Test-Path "$dist\latest.yml") {
            Copy-Item "$dist\latest.yml" "latest.yml" -Force
            Copy-Item "$dist\latest.yml" "beta.yml" -Force
          }
          if (Test-Path "resources/cert.cer") { Copy-Item "resources/cert.cer" "cert.cer" -Force }
          Get-ChildItem | Where-Object { $_.Name -like "OpenPortal-Remote-Setup-*.exe*" -or $_.Name -like "*.yml" -or $_.Name -eq "cert.cer" } | Format-Table Name, Length
          "version=$ver" >> $env:GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish pre-release
        # Cada build sai com a própria versão como tag
        # (v1.0.7-beta.20260930.205739). O electron-updater só aceita tags
        # SemVer: com a tag fixa "dev-latest", o app de desenvolvimento
        # instalado respondia "No published versions on GitHub" e nunca mais
        # se atualizava (2026-09-30). O passo seguinte apaga as anteriores.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.stage.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: 'Dev build (nightly) — run #${{ github.run_number }}'
          prerelease: true
          generate_release_notes: false
          make_latest: false
          files: |
            OpenPortal-Remote-Setup-*.exe
            OpenPortal-Remote-Setup-*.exe.blockmap
            latest.yml
            beta.yml
            cert.cer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete older dev releases
        # Fica só a dev recém-publicada: apaga as anteriores e a antiga
        # "dev-latest", com as tags, para não acumular uma release por push.
        shell: pwsh
        run: |
          $keep = "v${{ steps.stage.outputs.version }}"
          $old = gh release list --limit 100 --json tagName,isPrerelease | ConvertFrom-Json |
            Where-Object { $_.isPrerelease -and $_.tagName -ne $keep -and ($_.tagName -eq 'dev-latest' -or $_.tagName -match '^v\d+\.\d+\.\d+-(beta|dev)\.') }
          foreach ($r in $old) { gh release delete $r.tagName --yes --cleanup-tag }
          exit 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
