<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:24px;background:#f1f5f9;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;padding:24px;">
      <tr>
        <td>
          <h1 style="margin:0 0 12px;font-size:18px;">Confirme seu e-mail no OpenPortal</h1>
          <p style="margin:0 0 16px;font-size:14px;line-height:1.5;">
            Digite este código no aplicativo para terminar de criar sua conta:
          </p>
          <p style="margin:0 0 16px;font-size:32px;font-weight:bold;letter-spacing:8px;font-family:Consolas,monospace;">{{ .Token }}</p>
          <p style="margin:0 0 8px;font-size:13px;line-height:1.5;color:#475569;">
            O código vale por 10 minutos e só pode ser usado uma vez.
          </p>
          <p style="margin:0;font-size:13px;line-height:1.5;color:#475569;">
            Se você não criou uma conta no OpenPortal, ignore esta mensagem.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
